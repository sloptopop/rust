confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
# Our own unpublished crates have no licence field yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/hermit-os/hermit-rs.git",
    "https://github.com/hermit-os/socket2.git",
    "https://github.com/hermit-os/tokio.git",
]
