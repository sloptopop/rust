# cargo-deny policy shared by every sloptopop Rust repo.
# Keep this file identical across repos; change it everywhere at once.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# RustSec vulnerabilities are always errors; these extend that to the rest.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
# Owner 2026-11-06 (D-0933): allow every OSI-approved licence, copyleft included.
# CC0-1.0 (public domain, not OSI-submitted) and the LLVM exception are kept.
# Copyleft crates linked into proprietary binaries carry licence obligations:
# review GPL/AGPL/LGPL/EUPL/OSL deps before a release (cargo deny list).
allow = [
    "0BSD",
    "AAL",
    "AFL-1.1",
    "AFL-1.2",
    "AFL-2.0",
    "AFL-2.1",
    "AFL-3.0",
